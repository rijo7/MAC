<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
    integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

  <!-- Font Awesome for cart icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">


  <title>{% block title%} {% endblock %}</title>
  <style>
    {
      % block css %
    }

      {
      % endblock %
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/shop">MAC</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item {% if request.path == '/shop' or request.path == '/shop/' %}active{% endif %}">
          <a class="nav-link" href="/shop">Home</a>
        </li>
        <li class="nav-item {% if request.path == '/shop/about' or request.path == '/shop/about/' %}active{% endif %}">
          <a class="nav-link" href="/shop/about">About Us</a>
        </li>
        <li
          class="nav-item {% if request.path == '/shop/tracker' or request.path == '/shop/tracker/' %}active{% endif %}">
          <a class="nav-link" href="/shop/tracker">Tracker</a>
        </li>
        <li
          class="nav-item {% if request.path == '/shop/contact' or request.path == '/shop/contact/' %}active{% endif %}">
          <a class="nav-link" href="/shop/contact">Contact Us</a>
        </li>
      </ul>
      <form class="form-inline my-2 my-lg-0" method="GET" action="{% url 'search' %}">
        <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search" name="query"
          value="{{ query|default:'' }}">
        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
      </form>

      <button type="button" class="btn btn-secondary mx-2" id="popcart" data-container="body" data-toggle="popover" data-placement="bottom" data-html="true" data-content="Vivamus sagittis lacus vel augue laoreet rutrum faucibus.">
      Cart(<span id="cart">0</span>)
    </button>


      </button>
    </div>
  </nav>

  {% block body %} {% endblock %}

  <!-- Optional JavaScript -->
  <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.3.1.js" integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js"
    integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut"
    crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"
    integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k"
    crossorigin="anonymous"></script>
  {% block js %} {% endblock %}

  {% block extra_js %}
  <script>
// Initialize cart from localStorage or create a new one
let cart = localStorage.getItem('cart') ? JSON.parse(localStorage.getItem('cart')) : {};
updateCart(cart);

// Listen for "Add to Cart" buttons (only on pages where they exist)
document.addEventListener('click', function (e) {
    if (e.target && e.target.classList.contains('cart')) {
        let idstr = e.target.id.toString();

        let nameElement = document.getElementById('name' + idstr);
        let priceElement = document.getElementById('price' + idstr);

        let name = nameElement ? nameElement.textContent : "Unnamed Product";
        let price = priceElement ? parseFloat(priceElement.innerHTML.replace(/[^0-9.]/g, '')) : 0;

        if (cart[idstr]) {
            cart[idstr].quantity += 1;
        } else {
            cart[idstr] = { quantity: 1, name: name, price: price };
        }

        updateCart(cart);
    }
});

// Function to update cart count + popover
function updateCart(cart) {
    let sum = 0;
    let totalPrice = 0;

    for (let item in cart) {
        sum += cart[item].quantity;
        totalPrice += cart[item].quantity * cart[item].price;
    }

    const cartCountElement = document.getElementById('cart');
    if (cartCountElement) {
        cartCountElement.textContent = sum;
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    localStorage.setItem('totalPrice', totalPrice.toFixed(2));

    updatePopover(cart);
}

// Function to update popover with cart details
function updatePopover(cart) {
    let popStr = "<h5>Your Shopping Cart</h5><div class='mx-2 my-2'>";
    let i = 1;
    for (let item in cart) {
        popStr += `<b>${i}</b>. ${cart[item].name} ... Qty: ${cart[item].quantity}<br>`;
        i++;
    }
    popStr += `</div>
        <a href='/shop/checkout'><button class='btn btn-primary' id='checkout'>Checkout</button></a>
        <button class='btn btn-danger' id='clearCart'>Clear Cart</button>`;

    const popcart = document.getElementById('popcart');
    if (popcart) {
        popcart.setAttribute('data-content', popStr);
        $('#popcart').popover('show');
    }

    // Attach clear button
    $('#popcart').off('shown.bs.popover').on('shown.bs.popover', function () {
        document.getElementById('clearCart')?.addEventListener('click', function () {
            clearCart();
            $('#popcart').popover('hide');
        });
    });
}

// Function to clear cart
function clearCart() {
    cart = {};
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCart(cart);
    $('#popcart').popover('hide');
}

  </script>



  {% endblock %}


</body>

</html>
